name: Build Android APK

# MINE: personal harness policy, docs/harness/quality-gates.md.
# Validate accepted batches on releases or on demand, not each development push.
# GitHub is always checked; Play and manual signed builds are explicit opt-ins.
# Only releases publishes a signed beta, and only after successful checks.
on:
  push:
    branches: [ releases ]
  workflow_dispatch:
    inputs:
      include_play:
        description: 'Also validate and build the Play edition'
        type: boolean
        default: false
      build_release:
        description: 'Build signed APKs (publishes only on releases)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: GitHub batch validation (Play optional)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Override the action's default ("tools platform-tools"); the obsolete
          # "tools" package was removed from the SDK repo and breaks the step.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      # The committed wrapper pins Gradle 8.13 with a verified checksum; do not
      # regenerate it here, that would silently drop the verification.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Keep each flavor in its own invocation; compiling both has crashed Kotlin.
      - name: Android Lint, GitHub edition
        run: ./gradlew :app:lintGithubDebug :companion:lintGithubDebug --stacktrace

      - name: Android Lint, Play edition
        if: ${{ inputs.include_play == true }}
        run: ./gradlew :app:lintPlayDebug :companion:lintPlayDebug --stacktrace

      - name: Unit tests and debug builds, GitHub edition
        run: ./gradlew :app:testGithubDebugUnitTest :companion:testGithubDebugUnitTest :link:test :display:test :unitproto:test :roadreplay:test :app:assembleGithubDebug :companion:assembleGithubDebug :fakeunit:assembleDebug --stacktrace

      - name: Unit tests and debug builds, Play edition
        if: ${{ inputs.include_play == true }}
        run: ./gradlew :app:testPlayDebugUnitTest :companion:testPlayDebugUnitTest :app:assemblePlayDebug :companion:assemblePlayDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-githubDebug.html
            app/build/reports/lint-results-playDebug.html
          if-no-files-found: ignore

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dashwheel-debug
          path: |
            app/build/outputs/apk/github/debug/*.apk
            companion/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Upload Play debug APKs
        if: ${{ inputs.include_play == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dashwheel-play-debug
          path: |
            app/build/outputs/apk/play/debug/*.apk
            companion/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed build and release
    if: ${{ github.ref == 'refs/heads/releases' || (github.event_name == 'workflow_dispatch' && inputs.build_release == true) }}
    needs: checks
    runs-on: ubuntu-latest
    # Needed so the build can publish a GitHub Release with the APK.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version code counts main's history, and
          # the release notes list every commit since the previous release.
          fetch-depth: 0
          fetch-tags: true

      # The version code must only ever grow, or installs can't update in place.
      # It counts the commits on the first-parent line of history (one per
      # change that landed on main), plus an offset that carries on from the
      # last run-number build (v1.0.662). Renaming or recreating this workflow
      # changes nothing; only rewriting main's history could lower it.
      - name: Work out the version
        run: |
          code=$(( $(git rev-list --count --first-parent HEAD) + 200 ))
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$code" >> "$GITHUB_ENV"
          echo "Version 1.0.$code"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The actions from outside GitHub run in the job that holds the signing
      # key: each is pinned to the commit its tag named when it was last looked
      # at (the tag is in the comment), so a tag moved later changes nothing here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Override the action's default ("tools platform-tools"); the obsolete
          # "tools" package was removed from the SDK repo and breaks the step.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      # The committed wrapper pins Gradle 8.13 with a verified checksum; do not
      # regenerate it here, that would silently drop the verification.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "Release keystore prepared."
          else
            echo "::error::No KEYSTORE_BASE64 secret set. A debug-signed release could never be"
            echo "::error::updated in place, so the build stops here (Gradle enforces this too)."
            exit 1
          fi

      # Two editions from one code base (see Edition.kt): the GitHub edition
      # ships as an APK the in-app updater installs; the Google Play edition
      # ships as an App Bundle to upload to the Play Console, with a test APK
      # for sideloading. Each edition is built in its own Gradle invocation:
      # compiling both flavors in one run has crashed the Kotlin compiler.
      - name: Build the GitHub edition
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease :companion:assembleGithubRelease --stacktrace

      - name: Build the Google Play edition
        if: ${{ inputs.include_play == true }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease :app:assemblePlayRelease :companion:bundlePlayRelease --stacktrace

      # The launcher ships as Dashwheel-<version>.apk (the in-app updater takes
      # any .apk but the companion). The phone companion app ships in the same
      # release, under the name the launcher's pairing screen links to (and its
      # updater skips).
      # The Play edition (bundles and APK) is a workflow artifact only, never a
      # release asset: the updater takes the first launcher .apk of a release,
      # and the bundles are for the Play Console, not for drivers.
      - name: Name the outputs
        run: |
          v=$VERSION_NAME
          cp app/build/outputs/apk/github/release/app-github-release.apk "MyDashwheel-$v.apk"
          cp companion/build/outputs/apk/github/release/companion-github-release.apk mydashwheel-companion.apk

      - name: Name the Play outputs
        if: ${{ inputs.include_play == true }}
        run: |
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "MyDashwheel-$VERSION_NAME-play.aab"
          cp app/build/outputs/apk/play/release/app-play-release.apk "MyDashwheel-$VERSION_NAME-play.apk"
          cp companion/build/outputs/bundle/playRelease/companion-play-release.aab mydashwheel-companion-play.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openauto-dash-apk
          path: |
            MyDashwheel-${{ env.VERSION_NAME }}.apk
            mydashwheel-companion.apk
          if-no-files-found: error

      - name: Upload Play edition artifact
        if: ${{ inputs.include_play == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dashwheel-play
          path: |
            MyDashwheel-${{ env.VERSION_NAME }}-play.aab
            MyDashwheel-${{ env.VERSION_NAME }}-play.apk
            mydashwheel-companion-play.aab
          if-no-files-found: error

      # Readable changelog: one section per commit since the previous build of
      # releases (beta or stable). Commit subjects are rewritten to user-friendly
      # language; internal IDs, ticket refs and prefixes are stripped.
      # Promoting to stable writes the notes again, since the previous stable.
      - name: Write release notes
        if: ${{ github.ref == 'refs/heads/releases' }}
        run: |
          # Only release tags: a branch pre-release tag is not a release.
          prev=$(git describe --tags --abbrev=0 --match 'v1.0.*' HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..HEAD}
          {
            echo "## What's new in v$VERSION_NAME (beta)"
            echo
            git log $range --no-merges -n 30 --format='%s|%b' \
              | while IFS='|' read -r subject body; do
                # Skip internal/automated commits
                case "$subject" in
                  *"Co-Authored-By:"*|*"Signed-off-by:"*|*"Claude-Session:"*|"chore("*|"ci("*|"build("*|"revert("*) continue ;;
                esac
                # Rewrite conventional commit prefixes to user-friendly text
                friendly=$(echo "$subject" | \
                  sed -e 's/^fix([^)]*): /Fixed: /' \
                      -e 's/^feat([^)]*): /Added: /' \
                      -e 's/^perf([^)]*): /Improved performance: /' \
                      -e 's/^refactor([^)]*): /Refactored: /' \
                      -e 's/^style([^)]*): /UI tweak: /' \
                      -e 's/^docs([^)]*): /Documentation: /' \
                      -e 's/^test([^)]*): /Test coverage: /' \
                      -e 's/^chore([^)]*): /Maintenance: /' \
                      -e 's/^ci([^)]*): /CI: /' \
                      -e 's/^build([^)]*): /Build: /' \
                      -e 's/^revert([^)]*): /Reverted: /' \
                      -e 's/ *\(#[0-9]*\)$//' \
                      -e 's/ *\(#\([0-9]*\)\)/ (issue \1)/' \
                      -e 's/^ *//')
                # Capitalize first letter
                friendly=$(echo "$friendly" | sed 's/^./\u&/')
                echo "### $friendly"
                # Include body if present and not just metadata
                if [ -n "$body" ] && ! echo "$body" | grep -qE '^(Co-Authored-By:|Signed-off-by:|Claude-Session:)'; then
                  echo
                  echo "$body" | sed -e '/^Co-Authored-By:/d' -e '/^Signed-off-by:/d' -e '/^Claude-Session:/Id'
                fi
                echo
              done
            if [ -n "$prev" ]; then
              echo
              echo "_Changes since ${prev}._"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish beta
        if: ${{ github.ref == 'refs/heads/releases' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MyDashwheel v${{ env.VERSION_NAME }} (beta)
          # A pre-release, never "latest": the stable channel reads /releases/latest.
          prerelease: true
          make_latest: false
          # The launcher and the companion only: the Google Play edition's bundles are
          # for the Play Console, and stay in the "dashwheel-play" workflow artifact.
          files: |
            MyDashwheel-${{ env.VERSION_NAME }}.apk
            mydashwheel-companion.apk
          body_path: ${{ runner.temp }}/release-notes.md
